spring.application.name=cognit-backend

# Server specification
# Railway (and most PaaS) inject the port to bind on via $PORT; fall back to
# 8080 for local runs and docker-compose.
server.port=${PORT:8080}

# Actuator - only the health endpoint is exposed, used by Railway's healthcheck.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Extra CORS origins (deployed frontend/admin URLs) on top of the local
# dev ones baked into SecurityConfig — comma-separated, no trailing slashes.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cognit-db
spring.datasource.username=postgres
spring.datasource.password=abcd1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.ritika.cognitbackend=DEBUG
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-min-256-bits-for-hmac-sha}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=2592000000

# File Storage Configuration
file.upload-dir=uploads
file.max-size=52482880
file.allowed-types=image/jpeg,image/png,image/gif,image/webp

# Data seeding (set to true only if in development)
# Keep this OFF in production - seeding bcrypt-hashes ~1100 users and inserts
# thousands of posts on every boot. Override with APP_SEED_ENABLED=false on Railway.
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.authors=100
app.seed.subscribers=1000
app.seed.categories=30
app.seed.tags=20
app.seed.posts-per-author=10

# Redis Configuration
# Override REDIS_PASSWORD env var in production (leave blank for local dev with no auth)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache TTL (in seconds) reference by RedisCacheConfig
cache.ttl.posts=300
cache.ttl.categories=600
cache.ttl.tags=600
cache.ttl.default-ttl=120

# Async Thread Pool Configuration
async.core-pool-size=4
async.max-pool-size=16
async.queue-capacity=200
async.thread-name-prefix=cognit-async-

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME:d3318719d6c4ab}
spring.mail.password=${MAILTRAP_PASSWORD:your_mailtrap_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

cleanup.deleted-retention-days=30
cleanup.cron.purge-posts=0 0 2 * * *
cleanup.cron.purge-users=0 30 2 * * *
cleanup.cron.purge-tokens=0 0 * * * *
cleanup.cron.stats=0 0 */6 * * *
cleanup.cron.purge-otps=0 0 2 * * *
cleanup.cron.purge-comments=0 10 2 * * *
cleanup.cron.weekly-digest=0 0 8 * * MON
weekly-digest.max-posts=5
weekly-digest.batch-size=200

otp.validity-minutes=10

# Google Gemini AI configs (via OpenAI compatible endpoints)
# Gemini exposes an OpenAI-compatible REST API, no GCP project or gcloud CLI required

spring.ai.openai.api-key=${GEMINI_API_KEY:your-gemini-api-key}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.model=gemini-2.5-flash
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.chat.max-tokens=4096

ai.image.enabled:true
