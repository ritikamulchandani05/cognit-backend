spring.application.name=cognit-backend

# Server specification
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cognit-db
spring.datasource.username=postgres
spring.datasource.password=abcd1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.ritika.cognitbackend=DEBUG
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-min-256-bits-for-hmac-sha}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=2592000000

# File Storage Configuration
file.upload-dir=uploads
file.max-size=52482880
file.allowed-types=image/jpeg,image/png,image/gif,image/webp

# Data seeding (set to true only if in development)
app.seed.enabled=true
app.seed.authors=100
app.seed.subscribers=1000
app.seed.categories=30
app.seed.tags=20
app.seed.posts-per-author=10

# Redis Configuration
# Override REDIS_PASSWORD env var in production (leave blank for local dev with no auth)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache TTL (in seconds) reference by RedisCacheConfig
cache.ttl.posts=300
cache.ttl.categories=600
cache.ttl.tags=600
cache.ttl.default-ttl=120

# Async Thread Pool Configuration
async.core-pool-size=4
async.max-pool-size=16
async.queue-capacity=200
async.thread-name-prefix=cognit-async-

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME:d3318719d6c4ab}
spring.mail.password=${MAILTRAP_PASSWORD:your_mailtrap_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

cleanup.deleted-retention-days=30
cleanup.cron.purge-posts=0 * * * * *
cleanup.cron.purge-users=0 * * * * *
cleanup.cron.purge-tokens=0 0 * * * *
cleanup.cron.stats=0 */2 * * * *

# OTP services
otp.validity-minutes=10
cleanup.cron.purge-otps=0 0 2 * * *